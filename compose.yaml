version: "3.8"

services:
  frontend:
    image: node:lts-alpine
    volumes:
      - ./Cloud-API-Demo-Web:/app
    ports:
      - "8080:8080"
    environment:
      - VITE_BACKEND_BASE_URL=http://backend:6789
      - VITE_DJI_CLOUD_API_APP_ID=${DJI_CLOUD_API_APP_ID:?}
      - VITE_DJI_CLOUD_API_APP_KEY=${DJI_CLOUD_API_APP_KEY:?}
      - VITE_DJI_CLOUD_API_APP_LICENSE=${DJI_CLOUD_API_APP_LICENSE:?}
    command: sh -c "cd /app && yarn install && yarn serve"
    depends_on:
      - backend

  backend:
    build:
      context: DJI-Cloud-API-Demo
    ports:
      - "6789:6789"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://mysql:3306/cloud_sample?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=rootpassword
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      # Backend -> broker connection (internal docker network)
      - DJI_MQTT_HOST=${DJI_MQTT_HOST:-emqx}
      - DJI_MQTT_PORT=${DJI_MQTT_PORT:-1883}
      # Address advertised to clients/devices (Pilot app, web UI, docks) - must be LAN-routable
      - DJI_MQTT_PUBLIC_HOST=${DJI_MQTT_PUBLIC_HOST:-localhost}
      - DJI_MQTT_PUBLIC_PORT=${DJI_MQTT_PUBLIC_PORT:-1883}
      # DRC (Direct Remote Control) websocket broker advertised to devices
      - DJI_DRC_MQTT_HOST=${DJI_DRC_MQTT_HOST:-localhost}
      - DJI_DRC_MQTT_PORT=${DJI_DRC_MQTT_PORT:-8083}
      - DJI_CLOUD_API_APP_ID=${DJI_CLOUD_API_APP_ID:-your-app-id}
      - DJI_CLOUD_API_APP_KEY=${DJI_CLOUD_API_APP_KEY:-your-app-key}
      - DJI_CLOUD_API_APP_LICENSE=${DJI_CLOUD_API_APP_LICENSE:-your-app-license}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      emqx:
        condition: service_healthy
      minio:
        condition: service_healthy

  emqx:
    image: emqx/emqx:v4.0.0
    container_name: emqx
    environment:
      EMQX_DASHBOARD__DEFAULT_USER__LOGIN: admin
      EMQX_DASHBOARD__DEFAULT_USER__PASSWORD: admin
      EMQX_LISTENERS__TCP__DEFAULT__BIND: ${DJI_MQTT_PORT:-1883}
      # Pin the erlang node name to a stable value so mnesia data survives container recreates.
      # Without this emqx uses the container IP, which changes on every --force-recreate and
      # causes "register/listen error: badarg" on the stale volume.
      EMQX_NODE_NAME: emqx@127.0.0.1
    ports:
      - "${DJI_MQTT_PORT:-1883}:1883"
      - "8081:8081"
      - "${DJI_DRC_MQTT_PORT:-8083}:8083"
      - "8883:8883"
      - "8084:8084"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 5s
      timeout: 25s
      retries: 5
    volumes:
      - emqx_data:/opt/emqx/data

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloud_sample
    ports:
      - "3306:3306"
    volumes:
      - ./DJI-Cloud-API-Demo/sql/cloud_sample.sql:/docker-entrypoint-initdb.d/cloud_sample.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2022-02-18T01-50-10Z
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
      MINIO_ADDRESS: ":9000"
      MINIO_CONSOLE_ADDRESS: ":9001"
    command: minio server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  emqx_data:
  mysql_data:
  redis_data:
  minio_data:
